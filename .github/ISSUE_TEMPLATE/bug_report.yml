name: 🐛 Bug report
description: Report something that is broken or behaves incorrectly
title: "bug: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        Please search [existing issues](https://github.com/wruwami/QGraphPlot/issues?q=is%3Aissue+label%3Abug)
        first to avoid duplicates.

  - type: input
    id: qgraphplot-version
    attributes:
      label: QGraphPlot version
      description: Tag, commit SHA, or branch
      placeholder: "v0.1.0 / b000317 / main"
    validations:
      required: true

  - type: input
    id: qt-version
    attributes:
      label: Qt version
      placeholder: "6.7.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: frontend
    attributes:
      label: Frontend
      description: Which UI stack is affected?
      options:
        - QML (Qt Quick)
        - Widget (QWidget)
        - Core (no frontend)
        - Build / CI
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The behavior you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Smallest self-contained code or steps that reproduces the issue.
        Prefer a single QML snippet or a small C++ main().
      render: cpp
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / backtrace
      description: Compiler output, crash stack trace, or qWarning logs.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I reproduced this on the latest `main`
          required: true
