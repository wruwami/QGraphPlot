name: ✨ Feature request
description: Suggest a new chart type, API, or improvement
title: "feat: <short description>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before continuing, please check
        [the roadmap](https://github.com/wruwami/QGraphPlot/blob/main/QGraphPlot_MVP_Plan.md)
        and [open issues](https://github.com/wruwami/QGraphPlot/issues?q=is%3Aissue+label%3Aenhancement)
        to make sure it isn't already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the use case. "I want to display X but QGraphPlot can't
        express it because Y."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What API or behavior would you like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why they don't fit.

  - type: dropdown
    id: frontend
    attributes:
      label: Affected layer
      options:
        - Core (model / transform / series interface)
        - QML frontend
        - Widget frontend
        - Both QML and Widget
        - Examples / docs / build
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority for your project
      options:
        - Nice to have
        - Important
        - Blocking my work
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing requests and the roadmap
          required: true
        - label: This aligns with QGraphPlot's scope (high-performance Qt charts)
          required: true
