# ─────────────────────────────────────────────────────────────
# QGraphPlot CI — 셀프 호스팅 GCE 러너용
#
# 전제 조건 (러너 호스트에 1회 수동 설치):
#   pip install aqtinstall
#   aqt install-qt linux desktop 6.7.3 gcc_64
#       --outputdir /home/wruwami/Qt
#   apt-get install -y build-essential cmake git lcov cppcheck clang-format
#       libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0
#       libxcb-{glx0,icccm4,image0,keysyms1,randr0,render-util0,shm0,sync1,xfixes0,shape0,xinerama0,xinput0}
#       libdbus-1-3 libfontconfig1 libfreetype6
# ─────────────────────────────────────────────────────────────
name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.7.3"
  # Qt가 러너 호스트에 사전 설치된 경로
  QT_ROOT: "/home/wruwami/Qt/6.7.3/gcc_64"
  CMAKE_PREFIX_PATH: "/home/wruwami/Qt/6.7.3/gcc_64"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 빌드 + 테스트 (셀프 호스팅 GCE Linux)
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (self-hosted Linux, Qt 6.7.3)
    runs-on: [self-hosted, Linux]

    steps:
      # ── 1. 소스 체크아웃 ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. CMake 설정 (커버리지 활성화) ──
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" \
            -DQGRAPHPLOT_BUILD_COVERAGE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # ── 3. 빌드 ──
      - name: Build
        run: cmake --build build --config Debug --parallel

      # ── 4. 단위 테스트 ──
      - name: Run tests
        run: |
          export LD_LIBRARY_PATH="${{ env.QT_ROOT }}/lib:$LD_LIBRARY_PATH"
          ctest --test-dir build --build-config Debug --output-on-failure --parallel

      # ── 5. lcov 커버리지 수집 → Codecov 업로드 ──
      - name: Capture coverage
        run: |
          lcov --directory build --capture --output-file coverage.info
          lcov --remove coverage.info \
            '/usr/*' \
            '*/build/*' \
            '*/tests/*' \
            '*/examples/*' \
            '*/moc_*' \
            '*/ui_*.h' \
            --output-file coverage.filtered.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.filtered.info
          fail_ci_if_error: false

      # ── 6. 빌드 산출물 업로드 (디버깅용) ──
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            build/compile_commands.json
            build/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 정적 분석 (셀프 호스팅 GCE Linux)
  # ─────────────────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (cppcheck)
    needs: build-and-test
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (for compile_commands.json)
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cppcheck
        run: cppcheck @cppcheck.options src

  # ─────────────────────────────────────────────────────────────
  # 코드 포맷 검사 (셀프 호스팅 GCE Linux)
  # ─────────────────────────────────────────────────────────────
  format-check:
    name: Format Check (clang-format)
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check formatting
        run: |
          find src tests examples -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -exec clang-format --dry-run --Werror {} +
