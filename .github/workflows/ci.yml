name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: clang-format + cppcheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install clang-format and cppcheck
        run: sudo apt-get update && sudo apt-get install -y clang-format cppcheck

      - name: clang-format (auto-fix and commit)
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mapfile -d '' files < <(find src tests examples \( -name '*.cpp' -o -name '*.h' \) -print0 2>/dev/null || true)
          if [ ${#files[@]} -gt 0 ]; then
            clang-format -i "${files[@]}"
            if ! git diff --quiet -- "${files[@]}"; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add -- "${files[@]}"
              git commit -m "style: apply clang-format"
              git push origin "HEAD:$TARGET_BRANCH"
            fi
          fi

      - name: cppcheck
        run: |
          cppcheck --std=c++17 --language=c++ \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppressions-list=.cppcheck-suppressions \
            --xml --xml-version=2 \
            -DQ_OBJECT= '-DQ_PROPERTY(x)=' '-DQ_ENUMS(x)=' '-DQ_FLAGS(x)=' '-DQ_DECLARE_METATYPE(x)=' \
            -DQGRAPHPLOT_EXPORT= \
            -Demit= '-DQ_EMIT=' \
            -Dsignals=protected '-DQ_SIGNALS=protected' \
            -Dslots= '-DQ_SLOTS=' \
            -I src/core \
            src tests 2> cppcheck.xml
            
      - name: Convert Cppcheck XML to SARIF
        uses: Flast/cppcheck-sarif@v2
        with:
          input: cppcheck.xml
          output: cppcheck.sarif

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cppcheck.sarif
          
  build-and-test:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        qt-version: ['6.8.0']

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: "qtcharts qtshadertools qtquick3d"
          cache: true

      - name: Install lcov
        if: matrix.os == 'ubuntu-latest' && startsWith(matrix.qt-version, '6')
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Detect macOS graphics framework (AGL vs Metal)
        if: matrix.os == 'macos-latest'
        id: macos-gfx
        run: |
          macos_ver=$(sw_vers -productVersion)
          echo "macOS version: $macos_ver"
          major=$(echo "$macos_ver" | cut -d. -f1)
          # AGL framework was removed in macOS 12 (Monterey).
          # macOS 12+: use Metal / OpenGL only.
          # macOS <12: AGL is still available.
          if [ "$major" -ge 12 ]; then
            echo "HAS_AGL=false" >> "$GITHUB_ENV"
            echo "AGL not available (macOS $macos_ver) — will strip AGL references"
          else
            echo "HAS_AGL=true" >> "$GITHUB_ENV"
            echo "AGL available (macOS $macos_ver) — keeping AGL references"
          fi

      - name: Strip AGL references from Qt installation
        if: matrix.os == 'macos-latest' && env.HAS_AGL == 'false'
        run: |
          echo "Stripping AGL from Qt at $QT_ROOT_DIR"
          find "$QT_ROOT_DIR" -type f \( -name "*.cmake" -o -name "*.prl" -o -name "*.pc" \) \
            -exec sed -i '' \
              -e 's/-framework AGL//g' \
              -e 's/-framework agl//g' \
              -e 's/;AGL;/;/g' \
              -e 's/;AGL//g' \
              -e 's/AGL;//g' {} +

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DQGRAPHPLOT_BUILD_COVERAGE=${{ (matrix.os == 'ubuntu-latest' && startsWith(matrix.qt-version, '6')) && 'ON' || 'OFF' }}

      - name: Strip AGL from generated build files
        if: matrix.os == 'macos-latest' && env.HAS_AGL == 'false'
        run: |
          find build -type f \( -name "Makefile" -o -name "*.make" -o -name "link.txt" -o -name "*.cmake" -o -name "CMakeCache.txt" \) \
            -exec sed -i '' \
              -e 's/-framework AGL//g' \
              -e 's/AGL\.framework/OpenGL.framework/g' {} +

      - name: Build
        run: cmake --build build --parallel --config Debug

      - name: Test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run ctest --test-dir build --output-on-failure -C Debug
          else
            ctest --test-dir build --output-on-failure -C Debug
          fi

      - name: Install QGraphPlot package
        run: cmake --install build --prefix build/install_pkg --config Debug

      - name: Configure Consumer Smoke Test
        run: >
          cmake -S examples/consumer_test -B build/consumer_build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/install_pkg;${QT_ROOT_DIR}"

      - name: Strip AGL from Consumer Smoke Test build files
        if: matrix.os == 'macos-latest' && env.HAS_AGL == 'false'
        run: |
          find build/consumer_build -type f \( -name "Makefile" -o -name "*.make" -o -name "link.txt" -o -name "*.cmake" -o -name "CMakeCache.txt" \) \
            -exec sed -i '' \
              -e 's/-framework AGL//g' \
              -e 's/AGL\.framework/OpenGL.framework/g' {} +

      - name: Build Consumer Smoke Test
        run: cmake --build build/consumer_build --config Debug

      - name: Collect coverage
        if: matrix.os == 'ubuntu-latest' && startsWith(matrix.qt-version, '6')
        run: |
          lcov --capture --directory build --output-file coverage.info --ignore-errors inconsistent,gcov,mismatch
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/examples/*' --ignore-errors unused --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && startsWith(matrix.qt-version, '6')
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.info
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: true
